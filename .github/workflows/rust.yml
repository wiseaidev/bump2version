name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Run default tests
        run: cargo test
      - name: Run cli tests
        run: cargo test --features cli
      - name: Run rust-binary tests
        run: cargo test --features rust-binary

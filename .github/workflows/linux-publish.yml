name: Debian/RPM Packaging Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-debian:
    name: Build Debian Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dh-cargo \
            devscripts \
            pkg-config \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build Debian package
        run: |
          debuild --preserve-envvar PATH -us -uc -b
          mkdir -p dist
          mv ../*.deb ./dist/

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm pkg-config libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Prepare RPM build environment
        run: |
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp rpm/bump2version.spec ~/rpmbuild/SPECS/

          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -m1 '^version =' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')-${GITHUB_SHA::8}
          fi

          VERSION_CLEAN=$(echo "$VERSION" | sed 's|/|-|g' | tr -d '\n\r')
          VERSION_ONLY=$(echo "${VERSION_CLEAN%%-*}" | tr -d '\n\r')

          sed -i "s@Version:.*\$@Version: $VERSION_ONLY@" ~/rpmbuild/SPECS/bump2version.spec

          tar -czvf ~/rpmbuild/SOURCES/bump2version-${VERSION_ONLY}.tar.gz \
            --transform "s,^\.,bump2version-${VERSION_ONLY}," \
            --exclude=.git .

          echo "VERSION_ONLY=$VERSION_ONLY" >> $GITHUB_ENV

      - name: Build RPM package
        run: |
          rpmbuild -bb --nodeps ~/rpmbuild/SPECS/bump2version.spec
          mkdir -p dist
          mv ~/rpmbuild/RPMS/*/*.rpm ./dist/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: dist/*.rpm

  release:
    name: Publish Linux Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-debian, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Flatten packages directory
        run: |
          mkdir dist
          find packages -name '*.deb' -exec cp {} dist/ \;
          find packages -name '*.rpm' -exec cp {} dist/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.deb
            dist/*.rpm
          fail_on_unmatched_files: false
